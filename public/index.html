<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX Superbikes — 3D Showroom</title>
<style>
:root{--accent:#d10a10;--bg:#06060a;--fg:#f4f4f6;--mut:#8b8b96}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;background:linear-gradient(#000c,transparent)}
.logo{font-weight:900;letter-spacing:.3em}.logo b{color:var(--accent)}
nav a{color:var(--fg);text-decoration:none;margin-left:26px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.hero{position:relative;height:100vh;min-height:680px;overflow:hidden}
#stage,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#stage canvas{cursor:grab}
.ui{position:absolute;pointer-events:none;z-index:2}.ui *{pointer-events:auto}
.ghost{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:17vw;font-weight:900;color:#fff;opacity:.05;white-space:nowrap;pointer-events:none;z-index:1;letter-spacing:.04em;transition:opacity .4s}
.info{left:5vw;top:17vh;max-width:460px}.info *{pointer-events:none}
.brand{color:var(--accent);letter-spacing:.45em;font-size:.8rem;text-transform:uppercase}
h1{font-size:clamp(2.2rem,5.4vw,4.8rem);line-height:1;margin:10px 0 14px;font-weight:900}
.price{color:var(--mut);font-size:1.25rem}.price b{color:var(--fg)}
.count{font-size:.8rem;letter-spacing:.3em;color:var(--mut);margin-top:22px}.count b{color:var(--fg);font-size:1.6rem}
.stats{right:5vw;top:20vh;display:grid;gap:20px;text-align:right}.stats *{pointer-events:none}
.stat b{display:block;font-size:2.5rem;font-weight:800}.stat span{color:var(--mut);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
.bar{height:3px;background:#ffffff1a;margin-top:6px;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.arrow{top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid #fff3;background:#0008;color:#fff;font-size:1.4rem;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}.arrow:hover{background:var(--accent);border-color:var(--accent)}
.bottom{left:0;right:0;bottom:2.5vh;display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid #fff3;cursor:pointer}.sw button.on{border-color:#fff;transform:scale(1.25)}
.rev{background:var(--accent);color:#fff;border:0;padding:10px 26px;border-radius:30px;letter-spacing:.25em;font-weight:700;cursor:pointer;font-size:.75rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.chips button{background:#ffffff0d;color:var(--mut);border:1px solid #ffffff1c;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}.chips button.on{color:#fff;border-color:var(--accent);background:#ffffff1a}
.rail{display:flex;gap:10px;overflow-x:auto;max-width:96vw;padding:6px 4px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 150px;text-align:left;border-radius:12px;padding:12px;color:var(--fg);cursor:pointer;border:1px solid #ffffff1c;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 60%,#000),#0b0b10 75%);transition:.25s;opacity:.7}
.card:hover,.card.on{opacity:1;transform:translateY(-6px);border-color:var(--c);box-shadow:0 8px 28px color-mix(in srgb,var(--c) 45%,transparent)}
.card small{display:block;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75}.card b{font-size:.85rem}
section.enq{padding:110px 5vw;max-width:760px;margin:auto;text-align:center}
section.enq h2{font-size:2.2rem;margin-bottom:10px}section.enq p{color:var(--mut);margin-bottom:30px}
form{display:grid;gap:14px}
input,select{background:#ffffff0d;border:1px solid #ffffff22;color:var(--fg);padding:16px;border-radius:10px;font-size:1rem}select option{color:#000}
form button{background:var(--accent);color:#fff;border:0;padding:17px;border-radius:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-weight:700}
#msg{margin-top:16px;min-height:24px}footer{text-align:center;color:var(--mut);font-size:.75rem;padding:30px}
@media(max-width:800px){nav,.arrow{display:none}.stats{top:auto;bottom:25vh;right:auto;left:5vw;grid-auto-flow:column;text-align:left;gap:18px}.stat b{font-size:1.4rem}.info{top:12vh}}
</style>
</head>
<body>
<header><div class="logo">APEX<b>.</b>BIKES</div><nav><a href="#top">Showroom</a><a href="#enquire">Enquire</a></nav></header>
<div class="hero" id="top">
  <div id="stage"></div><div class="ghost" id="ghost"></div>
  <div class="ui info"><div class="brand" id="brand"></div><h1 id="name"></h1><div class="price">Ex-showroom <b id="price"></b></div><div class="count"><b id="idx">01</b> / <span id="tot">00</span></div></div>
  <div class="ui stats">
    <div class="stat"><b id="hp">0</b><span>Horsepower</span><div class="bar"><i id="b1"></i></div></div>
    <div class="stat"><b id="ts">0</b><span>Top speed km/h</span><div class="bar"><i id="b2"></i></div></div>
    <div class="stat"><b id="wt">0</b><span>Weight kg</span><div class="bar"><i id="b3"></i></div></div>
  </div>
  <button class="ui arrow" style="left:2vw" id="prev">‹</button><button class="ui arrow" style="right:2vw" id="next">›</button>
  <div class="ui bottom">
    <div class="row"><div class="row sw" id="sw"></div><button class="rev" id="rev">REV ⚡</button></div>
    <div class="chips" id="chips"></div>
    <div class="rail" id="rail"></div>
  </div>
</div>
<section class="enq" id="enquire"><h2>Book a test ride</h2><p>Pick your machine. We'll call you back.</p>
  <form id="f"><input id="n" placeholder="Your name" required><input id="p" placeholder="Phone number" required><select id="b"></select><button>Send enquiry</button></form><div id="msg"></div></section>
<footer>© APEX Superbikes. Specs and prices shown are sample data.</footer>

<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const el = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06060a);
scene.fog = new THREE.Fog(0x06060a, 9, 22);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = .7;
const camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
camera.position.set(5.5, 1.8, 6);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, autoRotate: true, autoRotateSpeed: 1.3, enablePan: false, minDistance: 4.5, maxDistance: 10, maxPolarAngle: Math.PI / 2.05 });
controls.target.set(0, .95, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .45, .6, .85);
composer.addPass(bloom); composer.addPass(new OutputPass());

const key = new THREE.SpotLight(0xffffff, 80, 22, .6, .7); key.position.set(4, 9, 4); scene.add(key);
const rim = new THREE.PointLight(0xd10a10, 40, 16); rim.position.set(-5, 2, -4); scene.add(rim);
const under = new THREE.PointLight(0xd10a10, 12, 8); under.position.set(0, .3, 0); scene.add(under);

// Floor: glossy disc + pulsing neon rings
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: 0x0b0b10, metalness: .9, roughness: .2 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xd10a10 });
const rings = [3.9, 3.3, 2.7].map((r, i) => { const m = new THREE.Mesh(new THREE.RingGeometry(r - .04, r, 128), i ? ringMat.clone() : ringMat); m.rotation.x = -Math.PI / 2; m.position.y = .01; scene.add(m); return m; });
// Floating particles
const N = 500, pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) { const a = Math.random() * 6.28, r = 2 + Math.random() * 7; pos.set([Math.cos(a) * r, Math.random() * 6, Math.sin(a) * r], i * 3); }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const pm = new THREE.PointsMaterial({ color: 0xd10a10, size: .04, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(pg, pm));

// ---------- Parametric 3D superbike ----------
const dark = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: .7 });
const metal = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, roughness: .25, metalness: 1 });
const black = new THREE.MeshStandardMaterial({ color: 0x15151a, roughness: .35, metalness: .8 });
const body = new THREE.MeshPhysicalMaterial({ color: 0xd10a10, metalness: .6, roughness: .2, clearcoat: 1, clearcoatRoughness: .04 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x223344, transparent: true, opacity: .45, roughness: 0 });
const lamp = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2c0, emissiveIntensity: 3 });
const tailL = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3 });
const pipe = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, roughness: .25, metalness: 1, emissive: 0xff4400, emissiveIntensity: 0 });
const beamMat = new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: .1, blending: THREE.AdditiveBlending, depthWrite: false });
const Y = new THREE.Vector3(0, 1, 0);
function tube(a, b, r, m) {
  a = new THREE.Vector3(...a); b = new THREE.Vector3(...b); const d = b.clone().sub(a);
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 16), m);
  t.position.copy(a).addScaledVector(d, .5); t.quaternion.setFromUnitVectors(Y, d.normalize()); return t;
}
function blob(sx, sy, sz, x, y, z, m, rz = 0) { const s = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), m); s.scale.set(sx, sy, sz); s.position.set(x, y, z); s.rotation.z = rz; return s; }
function wheel(s) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(.6, .17, 24, 72), dark), new THREE.Mesh(new THREE.TorusGeometry(.44, .045, 12, 48), metal));
  for (let i = 0; i < 5; i++) { const k = new THREE.Mesh(new THREE.BoxGeometry(.9, .06, .05), metal); k.rotation.z = i * Math.PI / 5; g.add(k); }
  const d = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .03, 40), metal); d.rotation.x = Math.PI / 2; d.position.z = .1; g.add(d);
  g.scale.setScalar(s); return g;
}
function build({ f: F, t: T, w: W, l: L, x: X }) {
  const g = new THREE.Group(), fx = 1.3 * L, rx = -1.25 * L, wy = .77 * W;
  const fw = wheel(W), rw = wheel(W * 1.05); fw.position.set(fx, wy, 0); rw.position.set(rx, wy * 1.05, 0); g.add(fw, rw);
  for (const z of [-.2, .2]) { g.add(tube([fx, wy, z * .6], [fx - .5, 1.65, z * .7], .045, metal)); g.add(tube([rx, wy, z], [-.15, .85, z], .05, black)); g.add(blob(.1, .12, .1, fx - .45, wy * 1.2, z * 1.2, black)); }
  g.add(tube([fx - .5, 1.65, 0], [-.1, 1.0, 0], .09, black));
  const e = new THREE.Mesh(new THREE.BoxGeometry(.95, .6, .55), black); e.position.set(.05, .95, 0); g.add(e);
  for (let i = 0; i < 4; i++) { const c = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .62, 16), metal); c.rotation.x = Math.PI / 2; c.position.set(-.25 + i * .22, 1.3, 0); g.add(c); }
  g.add(blob(.72 * T, .33 * T, .3 * T, .25, 1.55, 0, body));
  g.add(blob(.25 + .37 * F, .25 + .17 * F, .3, fx - .3, 1.38, 0, body, -.25));
  if (F > .5) g.add(blob(.5 * F, .3, .26, fx - .5, 1.75, 0, glass, -.6));
  g.add(blob(.12 + .04 * F, .1 + .02 * F, .2, fx + .2, 1.4, 0, lamp));
  g.add(blob(.4 + .35 * F, .2, .34 + .02 * F, .05, .78, 0, body));
  g.add(blob(.55, .13, .27, -.5 * L, 1.52, 0, dark));
  g.add(blob(.65, .22, .27, -.9 * L - .2, 1.6, 0, body, .2));
  g.add(blob(.08, .06, .15, -1.75 * L, 1.68, 0, tailL));
  for (const z of X ? [-.34, .34] : [-.34]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(.11, .09, 1.3, 20), pipe); p.rotation.z = Math.PI / 2; p.position.set(-1 * L, .85, z); g.add(p); g.add(tube([-.3, .65, z * .9], [-.4, .85, z], .06, pipe)); }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .8, 12), dark); bar.rotation.x = Math.PI / 2; bar.position.set(fx - .52, 1.7, 0); g.add(bar);
  const beam = new THREE.Mesh(new THREE.ConeGeometry(.8, 3.2, 32, 1, true), beamMat); beam.rotation.z = Math.PI / 2; beam.position.set(fx + 1.8, 1.4, 0); g.add(beam);
  g.userData = { fw, rw }; return g;
}

// ---------- UI / state ----------
const $ = id => document.getElementById(id);
const inr = n => '₹' + n.toLocaleString('en-IN');
const colors = ['#d10a10', '#1550e0', '#f5a800', '#3fbf2b', '#f2f2f2', '#7a3cff', '#ff6a00', '#111111'];
let bikes = [], list = [], cur = 0, bike = null, spawn = 1, rev = 0, flash = 0, brand = 'All';

function countTo(e, to) { const f = +e.textContent || 0, t0 = performance.now(); (function s(t) { const k = Math.min((t - t0) / 800, 1); e.textContent = Math.round(f + (to - f) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(s); })(t0); }
function setColor(c) {
  body.color.set(c); rings.forEach(r => r.material.color.set(c)); rim.color.set(c); under.color.set(c); pm.color.set(c);
  document.documentElement.style.setProperty('--accent', c);
  [...$('sw').children].forEach(b => b.classList.toggle('on', b.dataset.c === c));
}
function show(b) {
  if (bike) scene.remove(bike);
  bike = build(b.p); bike.scale.setScalar(1.15); scene.add(bike); spawn = 0; flash = 1;
  $('brand').textContent = b.brand; $('name').textContent = b.name; $('ghost').textContent = b.name.toUpperCase();
  $('price').textContent = inr(b.price); $('idx').textContent = String(bikes.indexOf(b) + 1).padStart(2, '0');
  countTo($('hp'), b.hp); countTo($('ts'), b.top); countTo($('wt'), b.weight);
  $('b1').style.width = b.hp / 330 * 100 + '%'; $('b2').style.width = b.top / 400 * 100 + '%'; $('b3').style.width = b.weight / 270 * 100 + '%';
  setColor(b.color); $('b').value = b.name;
  [...$('rail').children].forEach(c => c.classList.toggle('on', c.dataset.id === b.id));
  $('rail').querySelector('.on')?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function go(d) { cur = (cur + d + list.length) % list.length; show(list[cur]); }
function renderRail() {
  list = bikes.filter(b => brand === 'All' || b.brand === brand);
  $('rail').innerHTML = list.map(b => `<button class="card" style="--c:${b.color}" data-id="${b.id}"><small>${b.brand}</small><b>${b.name}</b></button>`).join('');
  [...$('chips').children].forEach(c => c.classList.toggle('on', c.textContent === brand));
}
fetch('/api/bikes').then(r => r.json()).then(d => {
  bikes = d; $('tot').textContent = d.length;
  $('chips').innerHTML = ['All', ...new Set(d.map(b => b.brand))].map(x => `<button>${x}</button>`).join('');
  $('chips').onclick = e => { if (e.target.tagName === 'BUTTON') { brand = e.target.textContent; renderRail(); cur = 0; show(list[0]); } };
  $('sw').innerHTML = colors.map(c => `<button data-c="${c}" style="background:${c}"></button>`).join('');
  $('sw').onclick = e => e.target.dataset.c && setColor(e.target.dataset.c);
  $('rail').onclick = e => { const c = e.target.closest('.card'); if (c) { cur = list.findIndex(b => b.id === c.dataset.id); show(list[cur]); } };
  $('b').innerHTML = d.map(b => `<option>${b.name}</option>`).join('');
  renderRail(); show(list[0]);
});
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
$('rev').onclick = () => { rev = 1; };
$('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/enquiry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('n').value, phone: $('p').value, bike: $('b').value }) });
  $('msg').textContent = r.ok ? '✔ Thanks! We will contact you shortly.' : 'Please fill in your name and phone.'; if (r.ok) e.target.reset();
};

function resize() { const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let mx = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; });
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  rev = Math.max(0, rev - dt * .6); flash = Math.max(0, flash - dt * 2.2); spawn = Math.min(spawn + dt * 1.5, 1);
  if (bike) {
    const k = 1 - Math.pow(1 - spawn, 4);
    bike.scale.setScalar(1.15 * (.5 + .5 * k)); bike.position.y = (1 - k) * 1.6;
    bike.rotation.y = (1 - k) * -1.2;
    const sp = 2 + rev * 45 + (1 - k) * 10; bike.userData.fw.rotation.z = bike.userData.rw.rotation.z -= sp * dt;
    bike.position.x = (Math.random() - .5) * rev * .02; bike.position.z = (Math.random() - .5) * rev * .02;
  }
  pipe.emissiveIntensity = rev * 4; beamMat.opacity = .08 + Math.sin(t * 3) * .02 + rev * .1;
  bloom.strength = .45 + rev * .9 + flash * .8;
  rings.forEach((r, i) => r.material.color.multiplyScalar(1)); rings[0].scale.setScalar(1 + Math.sin(t * 2) * .006); rings[2].rotation.z = t * .3;
  const a = pg.attributes.position; for (let i = 0; i < N; i++) { let y = a.getY(i) + dt * .25; if (y > 6) y = 0; a.setY(i, y); } a.needsUpdate = true;
  key.position.x = 4 * Math.cos(t * .5); key.position.z = 4 * Math.sin(t * .5);
  controls.target.x = mx * .6; controls.update(); composer.render();
});
</script>
</body>
</html>
